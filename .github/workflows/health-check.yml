name: CI — Node Server Health Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  health-check:
    name: Start server & verify /health
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node setup ──────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ── Install ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Unit / integration tests ─────────────────────────────────────────────
      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          # Random secret so sockets.test.js and routes.js share the same key
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-secret-not-for-production' }}

      # ── Start server in background ───────────────────────────────────────────
      - name: Start server in background
        run: |
          node src/app.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: production
          PORT: 3007
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-health-secret-not-for-production' }}

      # ── Wait for server to be ready ──────────────────────────────────────────
      - name: Wait for server to be ready
        run: |
          echo "Waiting for server on port 3007..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3007/health > /dev/null 2>&1; then
              echo "✅ Server is up after ${i}s"
              break
            fi
            echo "  attempt $i — not ready yet..."
            sleep 1
          done

      # ── /health endpoint check ───────────────────────────────────────────────
      - name: Check /health returns 200 + status ok
        run: |
          RESPONSE=$(curl -sf http://localhost:3007/health)
          echo "Response: $RESPONSE"

          STATUS=$(echo "$RESPONSE" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            process.stdout.write(d.status || '');
          ")

          if [ "$STATUS" != "ok" ]; then
            echo "❌ /health did not return status=ok (got: $STATUS)"
            exit 1
          fi
          echo "✅ /health returned status=ok"

      # ── Homepage check ───────────────────────────────────────────────────────
      - name: Check homepage returns 200
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3007/)
          echo "Homepage HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Homepage returned $HTTP_CODE instead of 200"
            exit 1
          fi
          echo "✅ Homepage returned 200"

      # ── Static asset check ───────────────────────────────────────────────────
      - name: Check critical static assets are served
        run: |
          for ASSET in /css/style.css /js/main.js /manifest.json; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3007$ASSET")
            echo "$ASSET → $CODE"
            if [ "$CODE" != "200" ]; then
              echo "❌ $ASSET returned $CODE"
              exit 1
            fi
          done
          echo "✅ All critical static assets returned 200"

      # ── Graceful shutdown ────────────────────────────────────────────────────
      - name: Graceful shutdown
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" && echo "Server stopped (PID $SERVER_PID)" || true
          fi
