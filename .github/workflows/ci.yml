name: CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Audit dependencies
        run: npm audit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Exercise responsive workspace
        run: npm run test:browser

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t location-tracker:test .
      - name: Start and check health
        run: |
          docker run -d --name tracker -p 3007:3007 location-tracker:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3007/health; then exit 0; fi
            sleep 1
          done
          docker logs tracker
          exit 1
