name: CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tracker-test.log || {
            python3 -c "import re; s=open('/tmp/tracker-test.log').read(); m=re.search(r'(?m)^\s*not ok.*',s); t=s[max(0,m.start()-100):m.start()+5000] if m else s[-5000:]; print('::error::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          }

      - name: Audit dependencies
        run: npm audit

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npx playwright-core install --with-deps chromium 2>&1 | tee /tmp/tracker-browser-install.log || {
            python3 -c "s=open('/tmp/tracker-browser-install.log').read()[-5000:]; print('::error::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          }
      - name: Exercise responsive workspace
        run: npm run test:browser

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t location-tracker:test .
      - name: Start and check health
        run: |
          docker run -d --name tracker -p 3007:3007 location-tracker:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3007/health; then exit 0; fi
            sleep 1
          done
          docker logs tracker
          exit 1
